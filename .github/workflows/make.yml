name: Build OpenWrt APK

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build OpenWrt 25.12 APK
        uses: nooblk-98/openwrt-package-compile-action@v1
        with:
          package-name: auto-mac-learn
          sdk-version: "25.12.5"
          sdk-target: x86
          sdk-subtarget: "64"
          artifact-name: auto-mac-learn-openwrt-25.12-x86-64
