name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ upx-ucl meson ninja-build pkg-config zlib1g-dev libssl-dev lua5.1 liblua5.1-dev

    - name: Build and install apk-tools (for apk mkpkg)
      run: |
        git clone --depth 1 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
        cd /tmp/apk-tools
        meson setup build \
          -Ddocs=disabled \
          -Dhelp=enabled \
          -Dcrypto_backend=openssl \
          -Ddefault_library=static \
          -Dlua_version=5.1 \
          -Dzstd=disabled \
          -Dpython=disabled \
          -Dtests=disabled
        ninja -C build
        APK_BIN=$(find build -type f -name apk -executable | head -1)
        sudo install -m755 "$APK_BIN" /usr/local/bin/apk
        apk --version
        apk mkpkg --help | head -5

    - name: make
      run: make

    - name: List artifacts
      run: ls -la *.apk *.deb *.ipk 2>/dev/null || true

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: |
          *.deb
          *.apk
          *.ipk
        if-no-files-found: warn
