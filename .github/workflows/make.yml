name: Build OpenWrt 25.12 APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare OpenWrt SDK Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-upx libfuse-dev ecj libncurses5-dev libncursesw5-dev \
          rsync wget curl python3 python3-pip git unzip zlib1g-dev gawk libssl-dev \
          gettext build-essential time perl subversion libelf-dev autoconf automake \
          libtool autopoint genisoimage libgmp-dev libmpc-dev
        
        # 下载 OpenWrt 25.12-SNAPSHOT 官方 x86_64 SDK
        SDK_URL="https://downloads.openwrt.org/releases/25.12-SNAPSHOT/targets/x86/64/openwrt-sdk-25.12-SNAPSHOT-x86-64_gcc-13.x_musl.Linux-x86_64.tar.xz"
        wget -q $SDK_URL -O sdk.tar.xz
        tar -xf sdk.tar.xz
        mv openwrt-sdk-* /workdir-sdk

    - name: Integrate Package into SDK
      run: |
        mkdir -p /workdir-sdk/package/mlx4_br
        # 将当前仓库的文件软链接或复制到 SDK package 目录中
        cp -af ./main.cc /workdir-sdk/package/mlx4_br/
        cp -af ./Makefile /workdir-sdk/package/mlx4_br/
        cp -rf ./package /workdir-sdk/package/mlx4_br/

    - name: Configure and Compile
      run: |
        cd /workdir-sdk
        make defconfig
        # 确保启用 apk 格式输出
        echo "CONFIG_PACKAGE_FORMAT_APK=y" >> .config
        echo "CONFIG_PACKAGE_mlx4_br=m" >> .config
        make defconfig
        
        # 开始编译
        make package/mlx4_br/compile V=s

    - name: Collect APK Artifacts
      run: |
        mkdir -p ./artifact_output
        find /workdir-sdk/bin/packages/ -name "mlx4_br*.apk" -exec cp {} ./artifact_output/ \;
        ls -la ./artifact_output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-25.12-mlx4_br-apk
        path: ./artifact_output/*.apk
