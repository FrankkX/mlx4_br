name: Build packages

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ \
          upx-ucl \
          meson \
          ninja-build \
          pkg-config \
          zlib1g-dev \
          libssl-dev \
          lua5.1 \
          liblua5.1-dev \
          fakeroot \
          file

    - name: Build and install apk-tools 3.x
      run: |
        set -e
        git clone --depth 1 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
        cd /tmp/apk-tools
        meson setup build \
          -Ddocs=disabled \
          -Dhelp=enabled \
          -Dcrypto_backend=openssl \
          -Ddefault_library=static \
          -Dlua_version=5.1 \
          -Dzstd=disabled \
          -Dpython=disabled \
          -Dtests=disabled
        ninja -C build
        APK_BIN=$(find build -type f -name apk -executable | head -1)
        echo "Installing apk from: $APK_BIN"
        sudo install -m755 "$APK_BIN" /usr/local/bin/apk
        which apk
        apk --version
        # Probe mkpkg (may exit non-zero without args; ignore)
        apk mkpkg 2>&1 | head -10 || true

    - name: Build packages
      run: |
        set -e
        make clean || true
        make
        echo "==== Artifacts ===="
        ls -la mlx4_br-*.apk mlx4_br*.deb 2>/dev/null || true
        # Require APK
        ls mlx4_br-*.apk >/dev/null 2>&1 || {
          echo "ERROR: No .apk produced"
          exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: |
          *.apk
          *.deb
        if-no-files-found: error
