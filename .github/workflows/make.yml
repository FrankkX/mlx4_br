
name: Build OpenWrt 25.12 APK

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils bzip2 file gawk \
            gettext git libncurses-dev libssl-dev \
            python3 rsync unzip wget zstd

      - name: Download OpenWrt 25.12.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64"

          PAGE="$(wget -qO- "$BASE/")"

          SDK_FILE="$(
            printf '%s' "$PAGE" |
            grep -oE 'openwrt-sdk-25\.12\.5-x86-64[^"]*\.tar\.zst' |
            sort -u |
            head -n 1
          )"

          if [ -z "$SDK_FILE" ]; then
            echo "::error::OpenWrt SDK archive not found."
            exit 1
          fi

          wget -nv "$BASE/$SDK_FILE" -O /tmp/openwrt-sdk.tar.zst

          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst \
            -C "$RUNNER_TEMP/openwrt-sdk" \
            --strip-components=1

          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Check source and fix known C++ issues
        shell: bash
        run: |
          set -euo pipefail

          test -f main.cc

          python3 <<'PY'
          from pathlib import Path

          p = Path("main.cc")
          s = p.read_text()

          # Add required standard/system headers if missing.
          anchor = "#include <utility>"
          additions = [
              "#include <ctime>",
              "#include <libgen.h>",
              "#include <string_view>",
              "#include <tuple>",
              "#include <vector>",
          ]

          if anchor not in s:
              raise SystemExit("Cannot find expected include anchor in main.cc")

          missing = [h for h in additions if h not in s]
          if missing:
              s = s.replace(
                  anchor,
                  anchor + "\n" + "\n".join(missing),
                  1
              )

          old = """      auto n = typedecl(*this)(*this);
                return n++;"""
          new = """      auto n = *this;
                ++(*this);
                return n;"""

          if old in s:
              s = s.replace(old, new, 1)
          elif "typedecl(*this)" in s:
              raise SystemExit(
                  "Found typedecl typo but its surrounding code differs; "
                  "fix postfix operator++ manually."
              )

          old_dtor = """RTNLHandle::~RTNLHandle() noexcept {
            if (fd > 0) {
              fd = -1;
              close(fd);
            }
          }"""

          new_dtor = """RTNLHandle::~RTNLHandle() noexcept {
            if (fd >= 0) {
              close(fd);
              fd = -1;
            }
          }"""

          if old_dtor in s:
              s = s.replace(old_dtor, new_dtor, 1)

          # Also handle the original formatting in the uploaded source.
          if "fd = -1;\n    close(fd);" in s:
              s = s.replace(
                  "if (fd > 0) {\n    fd = -1;\n    close(fd);\n  }",
                  "if (fd >= 0) {\n    close(fd);\n    fd = -1;\n  }",
                  1
              )

          p.write_text(s)
          PY

          echo "===== Source checks ====="
          grep -nE 'typedecl|RTNLHandle::~RTNLHandle|#include <vector>' \
            main.cc || true

      - name: Create OpenWrt package
        shell: bash
        run: |
          set -euo pipefail

          PKG_DIR="$SDK_DIR/package/auto-mac-learn"

          mkdir -p "$PKG_DIR/src" "$PKG_DIR/files"

          cp main.cc "$PKG_DIR/src/main.cc"

          # Keep common runtime assets from the legacy package directory.
          for path in etc usr lib; do
            if [ -d "package/$path" ]; then
              cp -a "package/$path" "$PKG_DIR/files/"
            fi
          done

          cat > "$PKG_DIR/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=auto-mac-learn
          PKG_VERSION:=1.0
          PKG_RELEASE:=1

          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)

          include $(INCLUDE_DIR)/package.mk

          define Package/auto-mac-learn
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Automatic MAC address learning
            DEPENDS:=+libstdcpp
          endef

          define Package/auto-mac-learn/description
            Learn bridge forwarding database MAC addresses and
            propagate them to supported NIC hardware filters.
          endef

          define Build/Prepare
            mkdir -p $(PKG_BUILD_DIR)
            $(CP) ./src/main.cc $(PKG_BUILD_DIR)/
          endef

          define Build/Compile
            $(TARGET_CXX) \
              $(TARGET_CXXFLAGS) \
              $(TARGET_LDFLAGS) \
              -std=gnu++20 \
              -o $(PKG_BUILD_DIR)/auto-mac-learn \
              $(PKG_BUILD_DIR)/main.cc
          endef

          define Package/auto-mac-learn/install
            $(INSTALL_DIR) $(1)/usr/sbin
            $(INSTALL_BIN) $(PKG_BUILD_DIR)/auto-mac-learn \
              $(1)/usr/sbin/auto-mac-learn

            if [ -d ./files ]; then \
              $(CP) ./files/. $(1)/; \
            fi
          endef

          $(eval $(call BuildPackage,auto-mac-learn))
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          make defconfig
          make package/auto-mac-learn/compile V=s

          echo "===== Generated APK files ====="
          find bin packages -type f -name '*.apk' -print

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk-artifacts"

          find "$SDK_DIR/bin" "$SDK_DIR/packages" \
            -type f -name 'auto-mac-learn*.apk' \
            -exec cp -v {} "$RUNNER_TEMP/apk-artifacts/" \;

          if ! find "$RUNNER_TEMP/apk-artifacts" \
            -type f -name '*.apk' | grep -q .; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/apk-artifacts"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-mac-learn-openwrt-25.12.5-x86-64
          path: ${{ runner.temp }}/apk-artifacts/*.apk
          if-no-files-found: error
