
name: Build mlx4-br for OpenWrt 25.12

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "OpenWrt release version"
        required: true
        type: string
        default: "25.12.0"

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            python3 \
            zstd

      - name: Download OpenWrt SDK
        id: sdk
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/x86/64"

          echo "Checking official SDK directory:"
          echo "$BASE_URL"

          curl -fsSL "$BASE_URL/" -o "$RUNNER_TEMP/sdk-index.html"

          SDK_FILE="$(
            python3 - "$RUNNER_TEMP/sdk-index.html" <<'PY'
          import re
          import sys
          from html.parser import HTMLParser

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href:
                          self.hrefs.append(href)

          parser = Links()
          with open(sys.argv[1], encoding="utf-8") as f:
              parser.feed(f.read())

          pattern = re.compile(
              r"^openwrt-sdk-.*Linux-x86_64\.tar\.(?:zst|xz|gz)$"
          )
          candidates = sorted(
              {x for x in parser.hrefs if pattern.match(x)}
          )

          if not candidates:
              sys.exit("ERROR: No x86_64 SDK archive found in official directory")

          print(candidates[-1])
          PY
          )"

          echo "Selected SDK: $SDK_FILE"

          mkdir -p "$RUNNER_TEMP/sdk-extract"

          curl -fL \
            "$BASE_URL/$SDK_FILE" \
            -o "$RUNNER_TEMP/sdk-archive"

          tar -xf "$RUNNER_TEMP/sdk-archive" \
            -C "$RUNNER_TEMP/sdk-extract"

          SDK_DIR="$(find "$RUNNER_TEMP/sdk-extract" \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'openwrt-sdk-*' -print -quit)"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory not found after extraction"
            exit 1
          fi

          echo "sdk_dir=$SDK_DIR" >> "$GITHUB_OUTPUT"

      - name: Check package layout
        shell: bash
        run: |
          set -euo pipefail

          test -f package/mlx4-br/Makefile
          test -f package/mlx4-br/src/main.cc
          test -f package/mlx4-br/files/mlx4_br.init

          echo "Package source files:"
          find package/mlx4-br -maxdepth 3 -type f -print

      - name: Prepare SDK package
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail

          cp -a package/mlx4-br "$SDK_DIR/package/"

          echo "Checking Makefile line numbers:"
          nl -ba "$SDK_DIR/package/mlx4-br/Makefile"

          echo "Checking for CRLF line endings:"
          if grep -Ilr $'\r' "$SDK_DIR/package/mlx4-br"; then
            echo "WARNING: CRLF line endings detected"
          fi

      - name: Configure SDK
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make defconfig

      - name: Compile mlx4-br
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          make package/mlx4-br/clean || true
          make package/mlx4-br/compile V=s

      - name: Collect APK
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          find "$SDK_DIR/bin/packages" \
            -type f \
            -name 'mlx4-br_*.apk' \
            -print \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

          if ! find "$GITHUB_WORKSPACE/dist" \
            -maxdepth 1 -type f -name 'mlx4-br_*.apk' \
            | grep -q .; then
            echo "ERROR: mlx4-br APK was not generated"
            echo "Available APK files:"
            find "$SDK_DIR/bin/packages" -type f -name '*.apk' -print || true
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum mlx4-br_*.apk | tee SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlx4-br-openwrt-25.12-x86_64
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
